  <title id="title">How I build</title><desc id="desc">Terminal-style summary of Jhon Wictor's working principles.</desc><rect width="1200" height="310" rx="3" fill="#0b0b0b"/><rect x="1" y="1" width="1198" height="308" rx="2" fill="none" stroke="#fff" stroke-opacity=".14"/><path d="M0 48h1200" stroke="#fff" stroke-opacity=".1"/><circle cx="23" cy="24" r="5" fill="#ff6b45"/><circle cx="42" cy="24" r="5" fill="#fff" fill-opacity=".18"/><circle cx="61" cy="24" r="5" fill="#fff" fill-opacity=".18"/>
  <g font-family="Cascadia Code,Consolas,monospace" font-size="16"><text x="32" y="90" fill="#ff6b45">jhon@product</text><text x="168" y="90" fill="#f7f7f2" fill-opacity=".48">~ $</text><text x="208" y="90" fill="#f7f7f2">cat approach.txt</text><text x="32" y="132" fill="#f7f7f2" fill-opacity=".68">01  Understand the constraint before drawing the interface.</text><text x="32" y="168" fill="#f7f7f2" fill-opacity=".68">02  Build the smallest complete flow, then make it resilient.</text><text x="32" y="204" fill="#f7f7f2" fill-opacity=".68">03  Treat accessibility, security and observability as product work.</text><text x="32" y="246" fill="#ff6b45">status</text><text x="98" y="246" fill="#f7f7f2" fill-opacity=".48">:</text><text x="118" y="246" fill="#f7f7f2">shipping useful systems</text><rect x="350" y="231" width="9" height="19" fill="#ff6b45"/></g>
</svg>
