<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Jhon Wictor — Designer and Frontend Developer</title><desc id="desc">Dark editorial banner with a coral accent and a modular interface grid.</desc>
